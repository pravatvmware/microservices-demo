apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - release/kubernetes-manifests.yaml

components:
  - kustomize/components/service-mesh-istio
  - kustomize/components/shopping-assistant

images:
  - name: shoppingassistantservice
    newName: shoppingassistantservice
    newTag: local

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: shoppingassistantservice
      spec:
        template:
          spec:
            containers:
              - name: server
                imagePullPolicy: IfNotPresent
                resources:
                  requests:
                    memory: "256Mi"
                    cpu: "100m"
                  limits:
                    memory: "768Mi"
                    cpu: "500m"